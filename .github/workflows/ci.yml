name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t file-viewer:test .

      - name: Run container
        run: docker run -d --rm --name file-viewer-test -p 8080:80 file-viewer:test

      - name: Wait for startup
        run: sleep 5

      - name: Check health endpoint
        run: curl --fail --silent http://127.0.0.1:8080/healthz

      - name: Check landing page
        run: curl --fail --silent http://127.0.0.1:8080/ | grep "File Viewer Libraries"

      - name: Check bundled library
        run: curl --fail --silent --head http://127.0.0.1:8080/libs/pdf.min.js

      - name: Check BSL console entrypoint
        run: curl --fail --silent http://127.0.0.1:8080/bsl_console/ | grep "BSL-editor"

      - name: Check BSL console Monaco loader
        run: curl --fail --silent --head http://127.0.0.1:8080/bsl_console/vs/loader.js

      - name: Stop container
        if: always()
        run: docker stop file-viewer-test
