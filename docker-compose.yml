name: file-viewer

services:
  file-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: file-viewer:local
    container_name: file-viewer
    ports:
      - "${FILE_VIEWER_PORT:-8080}:80"
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s