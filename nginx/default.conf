server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    types {
        text/html html htm;
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
        font/ttf ttf;
        font/otf otf;
        font/woff woff;
        font/woff2 woff2;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location /pdfjs/ {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        # На разработке лучше так:
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        access_log off;
    }

    location ~* \.html?$ {
        add_header Content-Type "text/html; charset=utf-8" always;
        add_header Access-Control-Allow-Origin "*" always;
        expires -1;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        add_header Access-Control-Allow-Origin "*" always;

        # На production можно заменить на public, immutable.
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        access_log off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Важно: если HTML живёт внутри ПоляHTMLДокумента, X-Frame-Options не критичен.
    # Но если будешь открывать страницы nginx внутри iframe, SAMEORIGIN может мешать.
    # Поэтому для отладки лучше не ставить X-Frame-Options.
    # add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf;
}